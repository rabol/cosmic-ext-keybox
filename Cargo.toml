[package]
name = "cosmic-ext-keybox"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-only"
description = "Inspect the secrets stored in your desktop keyring"
repository = "https://github.com/rabol/cosmic-ext-keybox"
authors = ["Steen Rabol <steen@rabol.dev>"]

[lib]
name = "keybox"
path = "src/lib.rs"

[dependencies]
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1.48", features = ["rt", "time", "macros", "sync"] }
tracing = "0.1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
zeroize = { version = "1.8", features = ["derive"] }

# Session encryption (dh-ietf1024-sha256-aes128-cbc-pkcs7). Same crate
# versions as oo7 0.6 so the dependency tree stays shared.
aes = "0.8"
cbc = { version = "0.1", features = ["std"] }
getrandom = "0.4"
hkdf = "0.12"
num-bigint-dig = { version = "0.9", features = ["zeroize"] }
sha2 = "0.10"

[dev-dependencies]
# Only used by tests to write disposable keyring files for an isolated oo7-daemon.
oo7 = { version = "=0.6.0", default-features = false, features = ["tokio", "native_crypto"] }
tempfile = "3"
tokio = { version = "1.48", features = ["full"] }
